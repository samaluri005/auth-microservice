name: CD - Promote image (SIT/UAT/PreProd/Prod)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        description: 'Image tag (commit SHA) to promote'
      target_env:
        required: true
        description: 'Target environment (sit|uat|preprod|prod)'

env:
  ACR_IMAGE: ${{ secrets.ACR_IMAGE }}
  AZURE_APP_CLIENT_ID: ${{ secrets.AZURE_APP_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_APP_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          oidc: true

      - name: Deploy Bicep for target env
        # POSTGRES_ADMIN_PASSWORD should be stored as an Environment secret for each target env.
        run: |
          PARAM_FILE="./bicep/params/env.${{ inputs.target_env }}.parameters.json"
          # Resolve resource group name from a repo secret whose name is RESOURCE_GROUP_<ENV>
          RG_SECRET_NAME=$(echo "RESOURCE_GROUP_${{ inputs.target_env }}" | tr '[:lower:]' '[:upper:]')
          # GitHub does not allow variable secrets lookup at runtime in bash; use expression:
      - name: Deploy Bicep (correct resource group lookup)
        run: |
          PARAM_FILE="./bicep/params/env.${{ inputs.target_env }}.parameters.json"
          # Use GitHub expression to lookup secret: RESOURCE_GROUP_<ENV in upper>
          RG="${{ secrets[format('RESOURCE_GROUP_{0}', toUpper(inputs.target_env))] }}"
          az deployment group create \
            -g "$RG" \
            --template-file ./bicep/main.bicep \
            --parameters @"$PARAM_FILE" \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}"

      - name: Update container app image to promoted tag
        run: |
          # container app name convention: ecauth-<env>-auth-app
          TARGET_RG="${{ secrets[format('RESOURCE_GROUP_{0}', toUpper(inputs.target_env))] }}"
          az containerapp update \
            --name ecauth-${{ inputs.target_env }}-auth-app \
            --resource-group "$TARGET_RG" \
            --image ${{ env.ACR_IMAGE }}:${{ inputs.image_tag }}
